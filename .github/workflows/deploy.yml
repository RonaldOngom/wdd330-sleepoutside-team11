name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site artifact
        run: |
          mkdir -p _site/Styles _site/Scripts _site/Images
          cp index.html _site/
          cp Styles/styles.css _site/Styles/
          cp Scripts/script.js _site/Scripts/
          # copy images if the folder exists
          if [ -d Images ]; then
            cp -r Images/. _site/Images/ || true
          fi
          touch _site/.nojekyll

      - name: Inject production API URL
        run: |
          if [ -n "$API_URL" ]; then
            sed -i "s|http://127.0.0.1:8001/api|$API_URL|g" _site/index.html
            # also replace the meta tag if present
            sed -i "s|content=\"http://127.0.0.1:8001/api\"|content=\"$API_URL\"|g" _site/index.html
            echo "Injected production API URL: $API_URL"
          else
            echo "LINKSY_API_URL secret not set — keeping development URL"
          fi
        env:
          API_URL: ${{ secrets.LINKSY_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
